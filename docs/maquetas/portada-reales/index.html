<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portada · fotos del club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@1,800&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Comparación: la portada con el 12 usando cada foto real del club. Capturas de la app (teléfono, tema Salvia). */
:root{color-scheme:dark}*{box-sizing:border-box;min-width:0}
body{margin:0;background:#0B0F0D;color:#EEF4F1;font:16px/1.5 Figtree,system-ui,sans-serif}
header{max-width:1240px;margin:0 auto;padding:28px max(5vw,16px) 6px}
h1{margin:0;font:italic 800 clamp(28px,6vw,40px)/1 Kanit,sans-serif;text-transform:uppercase}
header p{margin:8px 0 0;color:#9FB0A9;max-width:62ch}
.row{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px max(5vw,16px) 30px;max-width:1240px;margin:0 auto}
figure{flex:0 0 min(78vw,300px);margin:0;scroll-snap-align:start}
figure img{display:block;width:100%;height:auto;border-radius:26px;border:7px solid #1d1d20}
figcaption{margin-top:10px;font-size:14px;color:#C9D5D0}figcaption b{color:#F07A2B}
.top figcaption b{color:#C8F23A}
</style></head><body>
<header><h1>Portada con fotos del club</h1><p>El 12 completo sobre cada foto real (sin persona, nada va por delante del número). Desliza para comparar.</p></header>
<div class="row">
<figure class="top"><img src="img/p6.webp" alt="Foto 6" width="390" height="844" loading="lazy"><figcaption><b>6 · Recomendada.</b> Salón con mezzanine y focos: se reconoce el club y el 12 resalta.</figcaption></figure>
<figure class="top"><img src="img/p2.webp" alt="Foto 2" width="390" height="844" loading="lazy"><figcaption><b>2 · Muy buena.</b> Mancuernas: oscura y pareja, el 12 y el texto se leen perfecto.</figcaption></figure>
<figure class="top"><img src="img/p1.webp" alt="Foto 1" width="390" height="844" loading="lazy"><figcaption><b>1 · Buena.</b> Pasillo en blanco y negro con el foco entre el 1 y el 2; muy elegante.</figcaption></figure>
<figure><img src="img/p7.webp" alt="Foto 7" width="390" height="844" loading="lazy"><figcaption><b>7.</b> Ductos y focos; se ve industrial pero se pierde el ventanal.</figcaption></figure>
<figure><img src="img/p4.webp" alt="Foto 4" width="390" height="844" loading="lazy"><figcaption><b>4.</b> Bien leída, pero muy negra: no se nota que es un gimnasio.</figcaption></figure>
<figure><img src="img/p5.webp" alt="Foto 5" width="390" height="844" loading="lazy"><figcaption><b>5.</b> Vista desde arriba: el piso claro le quita fuerza al 12.</figcaption></figure>
<figure><img src="img/p3.webp" alt="Foto 3" width="390" height="844" loading="lazy"><figcaption><b>3.</b> Cardio: mucho detalle detrás del 12 y salen las marcas.</figcaption></figure>
</div></body></html>
